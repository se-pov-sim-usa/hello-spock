{{- if .Values.dockercfg}}
apiVersion: v1
kind: Secret
metadata:
  name: {{.Values.name}}-dockercfg
  namespace: {{.Values.namespace}}
  annotations:
    # The pull secret is referenced by name, so it must keep a stable name.
    harness.io/skip-versioning: "true"
  labels:
    app: {{.Values.name}}
type: kubernetes.io/dockercfg
data:
  .dockercfg: {{.Values.dockercfg}}
{{- end}}

# Values for the Harness Kubernetes service (manifest type: K8s Manifest).
#
# <+...> expressions are resolved by Harness at deploy time, before the
# templates in ./templates are rendered with Go templating.
# Per-environment differences live in ./overrides and are wired in as
# Harness environment or service overrides.

# Kept literal: Harness service names/identifiers may not be valid Kubernetes names.
name: hello-spock
namespace: <+infra.namespace>
createNamespace: false

# Primary artifact: ghcr.io/<owner>/<repo>, tag chosen at runtime (e.g. sha-<short> or a semver tag).
image: <+artifacts.primary.image>
# Base64 dockercfg Harness builds from the artifact connector; needed while the GHCR package is private.
dockercfg: <+artifacts.primary.imagePullSecret>

replicas: 2

env:
  config:
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_CSRF_TRUSTED_ORIGINS: ""
    # TLS terminates at the ingress; in-cluster traffic is plain HTTP.
    DJANGO_SECURE_SSL_REDIRECT: "false"
    LOG_LEVEL: info
    GUNICORN_WORKERS: "2"
  secrets:
    DJANGO_SECRET_KEY: <+secrets.getValue("hello_spock_django_secret_key")>

containerPort: 8000

service:
  type: ClusterIP
  port: 80

# Renders the stage service Harness Blue Green deployments swap traffic with.
blueGreen:
  enabled: false

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
